<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de commit</title>
</head>
<body>
    <h1>Formulario de contacto</h1>
    <p>Esta es una prueba de progreso: ahora el formulario incluye más campos y una estructura más clara.</p>
    <form action="#" method="post">
        <fieldset>
            <legend>Datos personales</legend>

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ruben Munguia Cardenas" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="r.munguia25@info.uas.edu.mx" required>
            <br><br>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="(123) 456-7890">
            <br><br>
        </fieldset>

        <fieldset>
            <legend>Mensaje</legend>

            <label for="asunto">Asunto:</label>
            <input type="text" id="asunto" name="asunto" placeholder="Consulta sobre el examen" required>
            <br><br>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" cols="40" placeholder="Escribe tu mensaje aquí..."></textarea>
            <br><br>
        </fieldset>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
