<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto mejorado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            max-width: 720px;
            width: 100%;
            margin: 20px;
            padding: 32px;
        }

        h1 {
            margin-top: 0;
            color: #1f3b70;
            font-size: 2rem;
        }

        p {
            margin: 0 0 24px;
            line-height: 1.6;
            color: #5a6378;
        }

        fieldset {
            border: 1px solid #d8e2ef;
            border-radius: 10px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        legend {
            padding: 0 10px;
            font-weight: 700;
            color: #1f3b70;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 20px;
        }

        .form-grid-full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2a3d66;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #cbd3e0;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 1rem;
            background: #f9fbff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #5b8def;
            box-shadow: 0 0 0 4px rgba(91, 141, 239, 0.14);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 0;
        }

        .submit-row {
            text-align: right;
        }

        button {
            background: #3764d4;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 14px 26px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #2f56c8;
        }

        @media (max-width: 620px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .submit-row {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Formulario de contacto</h1>
        <p>Completa los datos para enviarnos tu consulta. El formulario ahora es más claro, accesible y responsive.</p>

        <form action="#" method="post">
            <fieldset>
                <legend>Información personal</legend>

                <div class="form-grid">
                    <div>
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ruben Munguia Cardenas" required>
                    </div>

                    <div>
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="r.munguia25@info.uas.edu.mx" required>
                    </div>

                    <div>
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="(123) 456-7890" pattern="[0-9\s()+-]{7,20}">
                    </div>

                    <div>
                        <label for="asistencia">¿Prefieres ser contactado por?</label>
                        <select id="asistencia" name="asistencia">
                            <option value="email">Correo electrónico</option>
                            <option value="telefono">Teléfono</option>
                            <option value="whatsapp">WhatsApp</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Detalles de la consulta</legend>

                <div class="form-grid">
                    <div class="form-grid-full">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Selecciona una opción</option>
                            <option value="academico">Académico</option>
                            <option value="administrativo">Administrativo</option>
                            <option value="tecnico">Técnico</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <div class="form-grid-full">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Describe tu consulta con el mayor detalle posible..." required></textarea>
                    </div>
                </div>

                <div class="checkbox-group form-grid-full">
                    <input type="checkbox" id="notificaciones" name="notificaciones">
                    <label for="notificaciones">Deseo recibir novedades y actualizaciones por correo</label>
                </div>
            </fieldset>

            <div class="submit-row">
                <button type="submit">Enviar mensaje</button>
            </div>
        </form>
    </main>
</body>
</html>
